<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>网页桌宠「三角洲行动・蝶」</title>
		<style>
			html, body {
				margin: 0;
				padding: 0;
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				background-color: #2d5a3d;
				user-select: none;
				touch-action: none;
				-webkit-touch-callout: none;
				-webkit-user-select: none;
				-ms-content-zooming: none;
				-ms-user-select: none;
			}
			#bg-container {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 0;
			}
			#bg-container img {
				position: absolute;
				width: 100%;
				height: 100%;
				object-fit: cover;
				opacity: 0;
				transition: opacity 1s ease-in-out;
				filter: brightness(0.8) saturate(1.1);
			}
			#bg-container img.active {
				opacity: 0.85;
			}
			.loading-overlay {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: linear-gradient(to bottom, rgba(21, 74, 37, 0.8), rgba(21, 74, 37, 0.4));
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}
			.loading-spinner {
				width: 60px;
				height: 60px;
				border: 4px solid rgba(255,255,255,0.3);
				border-top-color: #4ade80;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
			.loading-text {
				margin-top: 20px;
				color: #fff;
				font-size: 18px;
				font-family: 'Microsoft YaHei', sans-serif;
				animation: pulse 1.5s ease-in-out infinite;
			}
			@keyframes pulse {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.5; }
			}
			.progress-bar {
				margin-top: 20px;
				width: 200px;
				height: 4px;
				background: rgba(255,255,255,0.2);
				border-radius: 2px;
				overflow: hidden;
			}
			.progress-fill {
				height: 100%;
				background: #4ade80;
				width: 0%;
				transition: width 0.3s ease;
			}
		</style>
	</head>
	<body>
		<div id="bg-container"></div>
		<div class="loading-overlay">
			<div class="loading-spinner"></div>
			<div class="loading-text">正在加载资源...</div>
			<div class="progress-bar">
				<div class="progress-fill" id="progress"></div>
			</div>
		</div>

		<script src="蝶 图片ID.js"></script>
		<script>
			let bgImages = [];
			let currentIndex = 0;
			let bgContainer = document.getElementById('bg-container');
			let progressBar = document.getElementById('progress');
			let loadingText = document.querySelector('.loading-text');

			function resolvePath(relativePath) {
				try {
					let parts = relativePath.split('/');
					let encodedParts = parts.map(encodeURIComponent);
					let encodedPath = encodedParts.join('/');
					let baseUrl = window.location.href;
					if (!baseUrl.endsWith('/')) {
						baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
					}
					return baseUrl + encodedPath;
				} catch (e) {
					console.error('路径解析失败:', relativePath, e);
					return relativePath;
				}
			}

			try {
				let data = window.PET_IMAGE_CONFIG;
				console.log('配置加载成功:', data);
				for (let item of data) {
					if (item.load) {
						bgImages = item.load.map(path => resolvePath(path));
						console.log('load图片路径:', bgImages);
						break;
					}
				}
				if (bgImages.length > 0) {
					preloadImages();
				} else {
					loadingText.textContent = '未找到load图片列表';
				}
			} catch (error) {
				console.error('加载配置失败:', error);
				loadingText.textContent = '加载配置失败';
			}

			function preloadImages() {
				let loadedCount = 0;
				let totalImages = bgImages.length;

				bgImages.forEach((path, index) => {
					let img = new Image();
					img.src = path;
					img.onload = () => {
						loadedCount++;
						let progress = (loadedCount / totalImages) * 100;
						progressBar.style.width = progress + '%';
						console.log('图片加载成功:', path);

						if (loadedCount === totalImages) {
							startSlideshow();
						}
					};
					img.onerror = () => {
						console.error('图片加载失败:', path);
						loadedCount++;
						let progress = (loadedCount / totalImages) * 100;
						progressBar.style.width = progress + '%';

						if (loadedCount === totalImages) {
							startSlideshow();
						}
					};
				});
			}

			function startSlideshow() {
				bgImages.forEach(path => {
					let img = document.createElement('img');
					img.src = path;
					bgContainer.appendChild(img);
				});

				let images = bgContainer.querySelectorAll('img');
				if (images.length > 0) {
					images[currentIndex].classList.add('active');
					setInterval(() => {
						images[currentIndex].classList.remove('active');
						currentIndex = (currentIndex + 1) % images.length;
						images[currentIndex].classList.add('active');
					}, 3000);
				}

				loadingText.textContent = '加载完成';
				setTimeout(() => {
					window.location.href = '主页面.html';
				}, 1000);
			}
		</script>
	</body>
</html>
