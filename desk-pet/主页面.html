<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>网页桌宠「三角洲行动・蝶」</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div id="bg-container"></div>

	<div class="pet-funds" id="pet-funds">
		<span class="pet-funds-label">宠物资金</span>
		<span class="pet-funds-amount" id="pet-funds-amount">¥ 10.0M</span>
	</div>

	<div class="menu-bar">
			<button class="menu-btn" onclick="togglePet()" title="切换宠物">🐾</button>
			<button class="menu-btn" onclick="toggleInventory()" title="仓库">🎒</button>
			<button class="menu-btn" onclick="changeBg()" title="切换背景">🖼️</button>
			<button class="menu-btn" onclick="showAbout()" title="关于">❓</button>
		</div>

		<div class="inventory-panel" id="inventory-panel">
			<div class="inventory-title">仓库</div>
			<div class="inventory-value">
				<span class="inventory-value-label">总价值</span>
				<span class="inventory-value-amount" id="inventory-total-value">¥ 0</span>
			</div>
			<div class="inventory-grid" id="inventory-grid">
				<div class="inventory-empty">仓库空空的~</div>
			</div>
		</div>

		<div class="pet-container" id="pet">
			<div class="speech-bubble" id="speech">你好呀~</div>
			<img id="pet-img" src="" alt="蝶">
		</div>

		<div class="info-panel">
			网页桌宠「三角洲行动・蝶」
		</div>

		<button class="raid-btn" id="raid-btn" onclick="triggerRaid()" title="跑刀（资产<5M可用）">🏃</button>
		<button class="insurance-btn" id="insurance-btn" onclick="triggerInsurance()" title="保险触发">🗡️</button>

		<script src="蝶 图片ID.js"></script>
		<script src="main.js"></script>
	</body>
</html>
